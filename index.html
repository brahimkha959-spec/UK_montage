<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unteck Hub & PNG Tuber</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            text-align: center;
        }
        /* PNG Tuber Section */
        .avatar-container {
            position: relative;
            width: 160px;
            height: 160px;
            margin: 0 auto 12px auto;
        }
        .avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 50%;
            background: #0f172a;
            border: 2px solid var(--accent-color);
        }
        .btn {
            background-color: var(--accent-color);
            color: #0f172a;
            border: none;
            padding: 10px 16px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.2s;
        }
        .btn:hover {
            opacity: 0.9;
        }
        /* Product Section */
        .product-img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            border-radius: 8px;
            background: #334155;
            margin-bottom: 8px;
        }
        /* Video Section */
        .video-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
        }
        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        h2 {
            font-size: 1.1rem;
            margin-bottom: 10px;
            color: var(--accent-color);
        }
        p {
            font-size: 0.9rem;
            color: #cbd5e1;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- قسم شخصية Unteck (PNG Tuber) -->
        <div class="card">
            <h2>شخصية Unteck التفاعلية</h2>
            <div class="avatar-container">
                <img id="avatarImage" src="closed.png" alt="Unteck Avatar">
            </div>
            <button class="btn" id="startBtn">تفعيل الميكروفون</button>
        </div>

        <!-- قسم عرض المنتج -->
        <div class="card">
            <h2>مكان المنتج</h2>
            <div class="product-info">
                <img src="product.png" alt="Product Image" class="product-img">
                <p>اسم المنتج أو الأداة الخاصة بك، مع إمكانية إضافة رابط الشراء أو التفاصيل هنا.</p>
            </div>
        </div>

        <!-- قسم عرض الفيديو -->
        <div class="card">
            <h2>مشاهدة الفيديو</h2>
            <div class="video-wrapper">
                <!-- استبدل الرابط برابط الفيديو الخاص بك -->
                <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <script>
        const startBtn = document.getElementById('startBtn');
        const avatarImage = document.getElementById('avatarImage');

        const closedImage = 'closed.png'; // صورة الفم المغلق
        const openImage = 'open.png';     // صورة الفم المفتوح

        startBtn.addEventListener('click', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const analyser = audioContext.createAnalyser();
                const microphone = audioContext.createMediaStreamSource(stream);
                
                analyser.fftSize = 512;
                microphone.connect(analyser);

                const dataArray = new Uint8Array(analyser.frequencyBinCount);
                
                startBtn.textContent = 'الميكروفون يعمل الآن ✅';
                startBtn.style.backgroundColor = '#22c55e';
                startBtn.style.color = '#ffffff';
                startBtn.disabled = true;

                function detectSound() {
                    analyser.getByteFrequencyData(dataArray);
                    let sum = 0;
                    for (let i = 0; i < dataArray.length; i++) {
                        sum += dataArray[i];
                    }
                    let average = sum / dataArray.length;

                    if (average > 15) {
                        avatarImage.src = openImage;
                    } else {
                        avatarImage.src = closedImage;
                    }

                    requestAnimationFrame(detectSound);
                }

                detectSound();
            } catch (err) {
                alert('تعذر الوصول إلى الميكروفون، يرجى السماح بالصلاحية.');
                console.error(err);
            }
        });
    </script>
</body>
</html>
